name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Types
        run: bun run types:check
      - name: Lint
        run: bun run lint:check
      - name: CLI smoke (render a deck in copy mode)
        run: |
          cat > /tmp/spec-ci.json <<'EOF'
          {
            "session": "ci-smoke",
            "title": "CI Smoke Deck",
            "items": [
              {
                "id": "D1",
                "type": "decision",
                "title": "Smoke decision",
                "problem": "CI needs to know the deck renders.",
                "options": [
                  { "key": "A", "label": "Yes", "justification": "It proves the render pipeline end to end.", "recommended": true },
                  { "key": "B", "label": "No", "justification": "It would leave the pipeline unverified." }
                ]
              }
            ]
          }
          EOF
          bun skills/mkd/cli/index.ts /tmp/spec-ci.json --no-open
          test -s ~/.mkd/deck-ci.html
